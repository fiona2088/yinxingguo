spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/A08?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  ai:
    mcp:
      server:
        type: async

mybatis:
  mapper-locations: classpath:mapper/mapper.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${MCP_SERVER_PORT:8081}

app:
  web-base-url: ${WEB_BASE_URL:http://localhost:8080}
  internal-api-key: ${INTERNAL_API_KEY:a08-internal-mcp-key-change-me}

logging:
  level:
    root: INFO
    mcp: DEBUG
